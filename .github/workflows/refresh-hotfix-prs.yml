name: refresh-hotfix-prs

on:
    push:
        branches: [ main ]
        paths:
            - "hotfixes/**"
            - "scripts/create-hotfix-pr-from-issue.py"
            - ".github/workflows/prepare-hotfix-pr.yml"
            - ".github/workflows/refresh-hotfix-prs.yml"

permissions:
    contents: write
    pull-requests: write
    issues: read

concurrency:
    group: refresh-hotfix-prs
    cancel-in-progress: false

jobs:
    refresh:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Install Python dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  python3 -m pip install --user PyYAML

            - name: Rebuild open hotfix PR branches from latest main
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git fetch origin main

                  mapfile -t PRS < <(
                    gh pr list \
                      --repo "${{ github.repository }}" \
                      --state open \
                      --json number,headRefName \
                      --jq '.[] | select(.headRefName | startswith("hotfix/security-issue-")) | "\(.number) \(.headRefName)"'
                  )

                  if [ "${#PRS[@]}" -eq 0 ]; then
                    echo "No open hotfix PRs to refresh."
                    exit 0
                  fi

                  for item in "${PRS[@]}"; do
                    PR_NUMBER="$(printf '%s' "$item" | awk '{print $1}')"
                    BRANCH="$(printf '%s' "$item" | awk '{print $2}')"
                    ISSUE_NUMBER="${BRANCH#hotfix/security-issue-}"

                    if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "$BRANCH" ]; then
                      echo "Skipping PR #${PR_NUMBER}: cannot extract issue number from branch ${BRANCH}."
                      continue
                    fi

                    echo "Refreshing PR #${PR_NUMBER} from issue #${ISSUE_NUMBER} on branch ${BRANCH}"

                    git reset --hard
                    git clean -fd
                    git checkout -B "${BRANCH}" origin/main

                    python3 scripts/create-hotfix-pr-from-issue.py \
                      --repo "${{ github.repository }}" \
                      --issue "${ISSUE_NUMBER}" \
                      --output /tmp/generated-hotfix-pr-body-${ISSUE_NUMBER}.md

                    if git diff --quiet; then
                      echo "No changes for ${BRANCH}."
                      git reset --hard
                      git clean -fd
                      continue
                    fi

                    git add hotfixes/
                    git commit -m "fix(hotfix): refresh remediation for issue #${ISSUE_NUMBER}"
                    git push --force-with-lease origin "${BRANCH}"

                    gh pr edit "${PR_NUMBER}" \
                      --repo "${{ github.repository }}" \
                      --body-file /tmp/generated-hotfix-pr-body-${ISSUE_NUMBER}.md
                  done

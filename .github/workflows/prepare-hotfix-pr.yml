name: prepare-hotfix-pr

on:
  workflow_run:
    workflows: ["build-php-images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to generate a hotfix PR from. Empty = all open security/trivy issues."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: prepare-hotfix-pr-global
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare hotfix pull request
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'build-php-images' &&
        github.event.workflow_run.head_branch == 'main'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user PyYAML

      - name: Create or update pull request
        id: hotfix_pr
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || '' }}
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="main"
          WORKDIR="/tmp/hotfix-pr"
          GROUPS_DIR="${WORKDIR}/groups"
          ISSUES_FILE="${WORKDIR}/issues.txt"
          OPEN_PRS_FILE="${WORKDIR}/open-prs.txt"

          rm -rf "${WORKDIR}"
          mkdir -p "${GROUPS_DIR}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${DEFAULT_BRANCH}"

          if [ -n "${ISSUE_NUMBER:-}" ]; then
            printf '%s\n' "${ISSUE_NUMBER}" > "${ISSUES_FILE}"
          else
            gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --label security \
              --label trivy \
              --limit 200 \
              --json number \
              --jq '.[].number' > "${ISSUES_FILE}"
          fi

          if [ ! -s "${ISSUES_FILE}" ]; then
            echo "No security/trivy issues selected."
            exit 0
          fi

          echo "Selected issues:"
          cat "${ISSUES_FILE}"

          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --base "${DEFAULT_BRANCH}" \
            --json number,headRefName,url \
            --jq '.[] | @base64' > "${OPEN_PRS_FILE}"

          while read -r selected_issue; do
            [ -z "${selected_issue}" ] && continue

            echo "Inspecting issue #${selected_issue}"

            if ! python3 scripts/create-hotfix-pr-from-issue.py \
              --repo "${{ github.repository }}" \
              --issue "${selected_issue}" \
              --output "${WORKDIR}/issue-${selected_issue}-body.md" \
              --metadata-output "${WORKDIR}/issue-${selected_issue}-metadata.json" \
              --no-write; then
              echo "Issue #${selected_issue} cannot be converted into a hotfix. Skipping."
              continue
            fi

            if [ ! -s "${WORKDIR}/issue-${selected_issue}-metadata.json" ]; then
              echo "Issue #${selected_issue} did not produce metadata. Skipping."
              continue
            fi

            hotfix_id="$(jq -r '.hotfix_id // empty' "${WORKDIR}/issue-${selected_issue}-metadata.json")"

            if [ -z "${hotfix_id}" ]; then
              hotfix_id="$(jq -r '.paths[0] // empty' "${WORKDIR}/issue-${selected_issue}-metadata.json" | sed -E 's#[^a-zA-Z0-9._-]+#-#g; s#^-+##; s#-+$##')"
            fi

            if [ -z "${hotfix_id}" ]; then
              hotfix_id="issue-${selected_issue}"
            fi

            safe_hotfix_id="$(printf '%s' "${hotfix_id}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"

            if [ -z "${safe_hotfix_id}" ]; then
              safe_hotfix_id="issue-${selected_issue}"
            fi

            printf '%s\n' "${selected_issue}" >> "${GROUPS_DIR}/${safe_hotfix_id}.issues"
            cp "${WORKDIR}/issue-${selected_issue}-metadata.json" "${GROUPS_DIR}/${safe_hotfix_id}.metadata.json"
          done < "${ISSUES_FILE}"

          if ! ls "${GROUPS_DIR}"/*.issues >/dev/null 2>&1; then
            echo "No hotfix groups were generated."
            exit 0
          fi

          sanitize_pr_body() {
            local input_file="$1"
            local output_file="$2"

            sed -E \
              -e '/^[[:space:]]*(Fixes|Closes|Resolves)[[:space:]]+#[0-9]+[[:space:]]*$/Id' \
              -e '/^## Additional remediation issues[[:space:]]*$/Id' \
              "${input_file}" \
              | awk '
                  /^## Remediation issues[[:space:]]*$/ {
                    skip = 1
                    next
                  }

                  /^## / {
                    skip = 0
                  }

                  skip {
                    next
                  }

                  {
                    print
                  }
                ' \
              | sed -E '/^[[:space:]]*$/N;/^\n$/D' \
              > "${output_file}"
          }

          build_remediation_issue_list() {
            local group_file="$1"
            local found_pr_number="$2"
            {
              if [ -n "${found_pr_number}" ]; then
                gh pr view "${found_pr_number}" \
                  --repo "${{ github.repository }}" \
                  --json title,body \
                  --jq '[.title, .body] | join(" ")' \
                  | grep -oE '#[0-9]+' || true
              fi

              while read -r grouped_issue; do
                [ -z "${grouped_issue}" ] && continue
                echo "#${grouped_issue}"
              done < "${group_file}"
            } | sort -Vu
          }

          build_pr_body() {
            local first_body_file="$1"
            local output_file="$2"
            local group_file="$3"
            local found_pr_number="$4"
            local sanitized_file="${WORKDIR}/pr-body-sanitized.md"
            local with_summary_file="${WORKDIR}/pr-body-with-summary.md"

            sanitize_pr_body "${first_body_file}" "${sanitized_file}"

            issue_list_lines="$(
              build_remediation_issue_list "${group_file}" "${found_pr_number}" | sed 's/^/- /'
            )"

            awk '
              NR == 1 && /^Adds an Alpine hotfix generated from security issue #[0-9]+\.$/ {
                print "Adds Alpine hotfix remediation generated from these security issues:"
                next
              }

              NR == 1 && /^Adds Alpine hotfix remediation generated from these security issues\.$/ {
                print "Adds Alpine hotfix remediation generated from these security issues:"
                next
              }

              { print }
            ' "${sanitized_file}" > "${with_summary_file}"

            {
              cat "${with_summary_file}"
              echo
              echo "## Remediation issues"
              echo
              printf '%s\n' "${issue_list_lines}"
            } > "${output_file}"
          }

          build_issue_title_list() {
            local group_file="$1"
            local found_pr_number="$2"
            build_remediation_issue_list "${group_file}" "${found_pr_number}" \
              | awk 'BEGIN { sep="" } { printf "%s%s", sep, $0; sep=", " } END { print "" }'
          }

          find_existing_hotfix_pr() {
            local branch="$1"
            shift
            local paths=("$@")

            FOUND_PR_NUMBER=""
            FOUND_PR_BRANCH=""
            FOUND_PR_URL=""

            if gh pr view "${branch}" \
              --repo "${{ github.repository }}" \
              --json number,headRefName,url,state \
              --jq 'select(.state == "OPEN") | @base64' > "${WORKDIR}/branch-pr.txt" 2>/dev/null && [ -s "${WORKDIR}/branch-pr.txt" ]; then
              local pr_json
              pr_json="$(base64 -d "${WORKDIR}/branch-pr.txt")"
              FOUND_PR_NUMBER="$(printf '%s' "${pr_json}" | jq -r '.number')"
              FOUND_PR_BRANCH="$(printf '%s' "${pr_json}" | jq -r '.headRefName')"
              FOUND_PR_URL="$(printf '%s' "${pr_json}" | jq -r '.url')"
              return 0
            fi

            while read -r encoded; do
              [ -z "${encoded}" ] && continue

              local pr_json pr_number pr_branch pr_url
              pr_json="$(printf '%s' "${encoded}" | base64 -d)"
              pr_number="$(printf '%s' "${pr_json}" | jq -r '.number')"
              pr_branch="$(printf '%s' "${pr_json}" | jq -r '.headRefName')"
              pr_url="$(printf '%s' "${pr_json}" | jq -r '.url')"

              case "${pr_branch}" in
                hotfix/*) ;;
                *) continue ;;
              esac

              if [ "${pr_branch}" = "${branch}" ]; then
                continue
              fi

              git fetch --quiet origin "${pr_branch}" || continue

              for hotfix_path in "${paths[@]}"; do
                if git cat-file -e "origin/${pr_branch}:${hotfix_path}" 2>/dev/null; then
                  FOUND_PR_NUMBER="${pr_number}"
                  FOUND_PR_BRANCH="${pr_branch}"
                  FOUND_PR_URL="${pr_url}"
                  return 0
                fi
              done
            done < "${OPEN_PRS_FILE}"

            return 1
          }

          ALL_RESULTS_FILE="${WORKDIR}/results.txt"
          : > "${ALL_RESULTS_FILE}"

          for group_file in "${GROUPS_DIR}"/*.issues; do
            [ -e "${group_file}" ] || continue

            hotfix_id="$(basename "${group_file}" .issues)"
            branch="hotfix/${hotfix_id}"

            echo "::group::Hotfix group ${hotfix_id}"
            echo "Issues in group:"
            cat "${group_file}"

            mapfile -t first_paths < <(jq -r '.paths[]' "${GROUPS_DIR}/${hotfix_id}.metadata.json")

            find_existing_hotfix_pr "${branch}" "${first_paths[@]}" || true

            if [ -n "${FOUND_PR_BRANCH}" ]; then
              branch="${FOUND_PR_BRANCH}"
              echo "Found existing hotfix PR #${FOUND_PR_NUMBER} on branch ${branch} for ${hotfix_id}."
              git checkout -B "${branch}" "origin/${branch}"
            else
              echo "No existing hotfix PR found for ${hotfix_id}. Creating/updating ${branch}."
              git checkout -B "${branch}" "origin/${DEFAULT_BRANCH}"
            fi

            all_hotfix_paths_file="${WORKDIR}/${hotfix_id}-paths.txt"
            : > "${all_hotfix_paths_file}"
            first_issue=""

            while read -r grouped_issue; do
              [ -z "${grouped_issue}" ] && continue

              if [ -z "${first_issue}" ]; then
                first_issue="${grouped_issue}"
              fi

              echo "Generating remediation from issue #${grouped_issue}"

              if ! python3 scripts/create-hotfix-pr-from-issue.py \
                --repo "${{ github.repository }}" \
                --issue "${grouped_issue}" \
                --output "${WORKDIR}/issue-${grouped_issue}-body.md" \
                --metadata-output "${WORKDIR}/issue-${grouped_issue}-metadata.json"; then
                echo "Issue #${grouped_issue} failed while generating hotfix files. Skipping."
                continue
              fi

              if [ ! -s "${WORKDIR}/issue-${grouped_issue}-metadata.json" ]; then
                echo "Issue #${grouped_issue} did not produce metadata while generating files. Skipping."
                continue
              fi

              jq -r '.paths[]' "${WORKDIR}/issue-${grouped_issue}-metadata.json" >> "${all_hotfix_paths_file}"
            done < "${group_file}"

            if [ ! -s "${all_hotfix_paths_file}" ]; then
              echo "No hotfix paths were generated for ${hotfix_id}."
              echo "::endgroup::"
              continue
            fi

            if [ -d hotfixes ]; then
              find hotfixes \( -name "index.yaml" -o -name "index.yml" -o -name "index.json" \) -print \
                | while read -r index_file; do
                  git restore --staged --worktree "${index_file}" 2>/dev/null || rm -f "${index_file}"
                done
            fi

            sort -u "${all_hotfix_paths_file}" | while read -r hotfix_path; do
              if [ -f "${hotfix_path}" ]; then
                git add "${hotfix_path}"
              fi
            done

            if git diff --cached --quiet; then
              echo "No hotfix script changes were generated for ${hotfix_id}."
              if [ -n "${FOUND_PR_NUMBER}" ]; then
                while read -r grouped_issue; do
                  [ -z "${grouped_issue}" ] && continue
                  printf '%s\t%s\t%s\n' "${grouped_issue}" "${FOUND_PR_NUMBER}" "${FOUND_PR_URL}" >> "${ALL_RESULTS_FILE}"
                done < "${group_file}"
              fi
              echo "::endgroup::"
              continue
            fi

            git commit -m "fix(hotfix): update remediation for ${hotfix_id}"
            git push --force-with-lease origin "${branch}"

            updated_body_file="${WORKDIR}/${hotfix_id}-pr-body.md"
            issue_list="$(build_issue_title_list "${group_file}" "${FOUND_PR_NUMBER}")"

            if [ -n "${FOUND_PR_NUMBER}" ]; then
              pr_number="${FOUND_PR_NUMBER}"
              pr_url="${FOUND_PR_URL}"

              gh pr view "${pr_number}" \
                --repo "${{ github.repository }}" \
                --json title,body \
                --jq '.body // ""' > "${WORKDIR}/${hotfix_id}-existing-pr-body.md"

              build_pr_body "${WORKDIR}/${hotfix_id}-existing-pr-body.md" "${updated_body_file}" "${group_file}" "${FOUND_PR_NUMBER}"

              gh pr edit "${pr_number}" \
                --repo "${{ github.repository }}" \
                --title "fix(hotfix): add remediation for issues ${issue_list}" \
                --body-file "${updated_body_file}"

              gh pr comment "${pr_number}" \
                --repo "${{ github.repository }}" \
                --body "Added remediation metadata for issues ${issue_list} to this existing hotfix PR."
            elif gh pr view "${branch}" \
              --repo "${{ github.repository }}" \
              --json state \
              --jq '.state' 2>/dev/null | grep -qx "OPEN"; then
              build_pr_body "${WORKDIR}/issue-${first_issue}-body.md" "${updated_body_file}" "${group_file}" ""

              gh pr edit "${branch}" \
                --repo "${{ github.repository }}" \
                --title "fix(hotfix): add remediation for issues ${issue_list}" \
                --body-file "${updated_body_file}"

              pr_number="$(gh pr view "${branch}" --repo "${{ github.repository }}" --json number --jq '.number')"
              pr_url="$(gh pr view "${branch}" --repo "${{ github.repository }}" --json url --jq '.url')"
            else
              build_pr_body "${WORKDIR}/issue-${first_issue}-body.md" "${updated_body_file}" "${group_file}" ""

              pr_url="$(
                gh pr create \
                  --repo "${{ github.repository }}" \
                  --base "${DEFAULT_BRANCH}" \
                  --head "${branch}" \
                  --title "fix(hotfix): add remediation for issues ${issue_list}" \
                  --body-file "${updated_body_file}"
              )"
              pr_number="$(gh pr view "${branch}" --repo "${{ github.repository }}" --json number --jq '.number')"
            fi

            while read -r grouped_issue; do
              [ -z "${grouped_issue}" ] && continue
              printf '%s\t%s\t%s\n' "${grouped_issue}" "${pr_number}" "${pr_url}" >> "${ALL_RESULTS_FILE}"
            done < "${group_file}"

            {
              echo "pr_number=${pr_number}"
              echo "pr_url=${pr_url}"
              echo "branch=${branch}"
            } >> "$GITHUB_OUTPUT"

            echo "::endgroup::"
          done

          if [ -s "${ALL_RESULTS_FILE}" ]; then
            echo "Generated or updated remediation PRs:"
            cat "${ALL_RESULTS_FILE}"
          fi

          while IFS=$'\t' read -r commented_issue commented_pr_number commented_pr_url; do
            [ -z "${commented_issue}" ] && continue
            [ -z "${commented_pr_url}" ] && continue

            body="Generated or updated hotfix remediation in PR #${commented_pr_number}: ${commented_pr_url}"
            gh issue comment "${commented_issue}" \
              --repo "${{ github.repository }}" \
              --body "${body}"
          done < "${ALL_RESULTS_FILE}"
